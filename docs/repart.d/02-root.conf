# Root: LUKS2-encrypted btrfs, grown to fill the disk. The deployment lives
# at the btrfs TOP LEVEL (no subvolumes). This must match the sealed kargs
# (features/boot/overlay/usr/lib/bootc/kargs.d/10-rootfs.toml), which mount
# the partition found by this GPT type via gpt-auto.
#
# Encrypt=key-file creates the LUKS volume with an EMPTY passphrase, so you add
# a real one right after installing (docs/install.md). Delete the line for an
# unencrypted install.
[Partition]
Type=root
Format=btrfs
SizeMinBytes=10G
Encrypt=key-file
