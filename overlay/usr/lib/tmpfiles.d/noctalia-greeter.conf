# noctalia-greeter's state dir (last user/session, appearance sync). Upstream's
# setup_greeter_system.sh would mkdir+chown it at install time; on a bootc image
# /var content must be created at boot instead. Owner = the greetd session user.
d /var/lib/noctalia-greeter 0750 greetd greetd -
# Its SELinux label, recursively, on every boot (build_files/finalize.sh has
# the rule and why): a dir made before the rule, or a file that got the wrong
# label, is set right. Owner and mode stay as they are.
Z /var/lib/noctalia-greeter - - - -
