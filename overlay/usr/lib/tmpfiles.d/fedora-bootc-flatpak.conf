# System-wide Flatpak permission overrides, copied into place once (C) so that
# `flatpak override` can still edit them on the machine.
#
# VS Code: share the host /tmp. With Dev Containers the container engine runs
# on the host (through the podman shim in /etc/skel/.var/app/), and the Dev
# Containers CLI hands it files it writes to /tmp, e.g. the Dockerfile that
# maps the container user to your UID. Applies to the system-wide install that
# packages/flatpaks.txt does.
d /var/lib/flatpak/overrides 0755 root root -
C /var/lib/flatpak/overrides/com.visualstudio.code - - - - /usr/share/fedora-bootc/flatpak-overrides/com.visualstudio.code
