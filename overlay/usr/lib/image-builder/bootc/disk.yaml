# Disk layout for the image-builder CLI, read from inside the image, so
# `image-builder` can produce qcow2/raw/ami images from it. Not used by
# `just qcow2` (bcvk builds its own disk).
# Partition type UUIDs are what gpt-auto root discovery matches (x86-64 root).
# btrfs WITHOUT subvolumes: must match the sealed kargs (no subvol=).
mount_configuration: "none"
partition_table:
  type: "gpt"
  partitions:
    - size: "2 GiB"
      type: "c12a7328-f81f-11d2-ba4b-00a0c93ec93b" # ESP
      payload_type: "filesystem"
      payload:
        type: "vfat"
        # wrong mountpoint, but isn't actually used; works around an
        # image-builder bug:
        mountpoint: "/boot/efi"
        label: "ESP"
    - size: "10 GiB"
      type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709" # x86-64 root
      payload_type: "filesystem"
      payload:
        type: "btrfs"
        label: "root"
        mountpoint: "/"
