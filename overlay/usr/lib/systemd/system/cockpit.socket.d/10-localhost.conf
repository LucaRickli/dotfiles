# Cockpit is for this machine only: listen on loopback instead of every
# interface, so the firewall is not what keeps it private. From another
# machine, tunnel: ssh -L 9090:localhost:9090 <user>@<machine>
# Over loopback cockpit-ws serves plain HTTP (it only redirects remote clients
# to HTTPS), so http://localhost:9090 needs no certificate.
[Socket]
ListenStream=
ListenStream=127.0.0.1:9090
ListenStream=[::1]:9090
