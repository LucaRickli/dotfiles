# Image additions to sway's stock configuration. Fedora's /etc/sway/config
# (from sway-config-upstream) ends with `include /etc/sway/config.d/*`, so this
# rides on the packaged defaults instead of replacing them; a user config at
# ~/.config/sway/config replaces the whole stack, this file included.

# The Noctalia shell: bar, launcher, notifications, and the polkit agent.
exec noctalia

# Secret Service for apps that expect one (VS Code, browsers), same as the
# labwc autostart.
exec /usr/bin/gnome-keyring-daemon --start --components=secrets

# The stock config starts swaybar; Noctalia is the bar here. A bar block cannot
# be deleted from an include, only reconfigured, so hide it.
bar bar-0 mode invisible

# The stock config binds $mod+Return to foot and $mod+d to wmenu-run; the
# image's terminal is ghostty and its launcher is Noctalia's. --no-warn,
# because overriding an existing binding is exactly the intent.
bindsym --no-warn Mod4+Return exec ghostty
bindsym --no-warn Mod4+d exec noctalia msg panel-toggle launcher
