# Keyboard layout for X11 (what `localectl set-x11-keymap ch` writes). localed
# also serves it to niri, whose /etc/niri/config.kdl leaves xkb empty.
# Elsewhere: labwc /etc/xdg/labwc/environment, the console /etc/vconsole.conf,
# noctalia-greeter /var/lib/noctalia-greeter/greeter.toml (defaults).
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "ch"
EndSection
