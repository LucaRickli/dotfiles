# =============================================================================
# NVIDIA early KMS — mkinitcpio drop-in
# Deployed to: /etc/mkinitcpio.conf.d/nvidia.conf
# After deploying, run: sudo mkinitcpio -P
# =============================================================================
#
# Adding NVIDIA modules to the initramfs (early KMS) ensures the NVIDIA DRM
# driver is initialised before the display manager starts. Without early KMS:
#   • GDM may fall back to Xorg or fail to start on Wayland.
#   • The kernel parameter nvidia_drm.modeset=1 takes effect too late.
#
# These four modules are all required:
#   nvidia         — core driver
#   nvidia_modeset — KMS/modesetting support
#   nvidia_uvm     — unified virtual memory (CUDA, NVENC, etc.)
#   nvidia_drm     — DRM/KMS integration (the one that matters for Wayland)
# =============================================================================

MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
