# =============================================================================
# NVIDIA kernel module options
# Deployed to: /etc/modprobe.d/nvidia.conf
# =============================================================================
#
# nvidia_drm.modeset=1
#   Enables DRM kernel mode-setting. REQUIRED for Wayland compositors to use
#   the NVIDIA GPU directly (via GBM/EGL). Without this, Hyprland will refuse
#   to start or fall back to software rendering.
#
# nvidia_drm.fbdev=1
#   Exposes a /dev/fb device backed by the NVIDIA DRM driver (kernel ≥ 6.2).
#   Required for GDM to display on NVIDIA in Wayland mode.
#
# nvidia.NVreg_PreserveVideoMemoryAllocations=1
#   Keeps GPU memory allocations across suspend/resume cycles.
#   Without this, suspend-to-RAM will corrupt the Wayland session on resume.
# =============================================================================

options nvidia_drm modeset=1 fbdev=1
options nvidia    NVreg_PreserveVideoMemoryAllocations=1
