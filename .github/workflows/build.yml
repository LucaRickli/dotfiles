# Build the OS images and push them to GHCR (ghcr.io/<owner>/fedora-bootc).
#
# Which images: `just images`, the OS (latest) and one per add-on feature
# (features/*/pkg.yml with `addon: true`), so a new add-on is one folder and
# gets its own job here, tags and scan category. A build publishes exactly
# ONE tag per image and overwrites nothing:
#
#   build-<sha>                  the OS, unsealed: an ordinary bootc image
#   build-<sha>-uki              the same thing sealed into a signed UKI
#   build-<sha>-<add-on>         unsealed, the OS plus that add-on
#   build-<sha>-<add-on>-uki     that one sealed
#
# so build-<sha>, -uki, -nvidia and -nvidia-uki for the OS and the nvidia
# add-on. The unsealed ones carry the plain names; -uki says what was done
# to it. The tags machines follow (latest, latest-uki, <add-on>,
# <add-on>-uki) are never written here: release.yml promotes a build to them
# once its ISO is built and the release is published, by pointing those tags
# at a digest that already exists. Promotion keeps the digest, so the cosign
# signature made here still covers it.
#
# Every build is therefore installable and none of them displaces another. Old
# ones are collected at the end of this file.
#
# Runs on pushes to main (changes that cannot touch the image excluded, check.yml
# and ci.yml cover those), on demand, and as the first job of a release. It has
# no schedule of its own: the weekly release rebuilds on the floating Fedora
# base, and Renovate's merges (actions, chunkah, noctalia-greeter) trigger a
# build.
# Pull requests reach it through ci.yml, the PR gate, and only build and scan.
# Every pushed image is signed with cosign, in the `sign` job once every push
# is done (.github/actions/sign); unsigned images are unusable.
#
# The two private keys, SECUREBOOT_PRIVATE_KEY (the Secure Boot db key,
# consumed by the builds themselves) and SIGNING_SECRET (cosign), are
# referenced only by the jobs that declare the `release` environment, and
# what runs on the runner in those jobs is kept to the build (inside
# podman), cosign and GitHub's and Docker's own pinned actions: trivy runs
# in containers without secrets or network (.github/actions/scan-image),
# `just` comes from its checked release (.github/actions/install-tools),
# and the cosign key is used in a job that does nothing else. A third-party
# binary on the runner could read every secret of its job out of the
# runner's memory. Kept as secrets of that environment, restricted to main
# (docs/fork.md), they reach those jobs alone and no workflow on another
# branch; as repository secrets (which work too) any job that names them
# can read them.
#
# Runs on GitHub-hosted ubuntu-26.04 runners (rootless podman 5.x). Each job is
# a fresh VM with no layer cache, so every job builds what it needs from
# scratch; .github/actions/prepare-runner gets the VM ready for that. The
# jobs run the Justfile's recipes (images, build-base, build), so a build here
# is the same as one on a workstation.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      # dotfiles are not part of the image; check.yml validates them
      - "home/**"
      - "dotfiles.sh"
      - ".github/workflows/check.yml"
      # host helpers (check.yml runs check-dotfiles.sh, ci.yml lints the rest)
      - "scripts/**"
      # not part of the image either: devcontainer.yml and flatpak.yml build
      # the development tools, and the Flatpak list is installed per machine
      - "devtools/**"
      - ".github/workflows/devcontainer.yml"
      - ".github/workflows/flatpak.yml"
      - "flatpaks.txt"
      # the live ISO's system, not the image: release.yml builds it (ci.yml
      # on pull requests)
      - "installer/**"
      # CI plumbing that builds nothing itself; ci.yml lints it on push
      - "renovate.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/notify.yml"
      - ".github/workflows/release.yml"
      - ".github/rulesets/**"
      - ".github/actionlint.yaml"
      - ".github/zizmor.yml"
  workflow_dispatch:
  # Called by release.yml and by ci.yml (pull requests). The outputs come
  # from `plan`, a single job, so they are not last-matrix-job-wins.
  workflow_call:
    # The two keys, passed by name from release.yml (an environment secret
    # resolves in the job that declares the environment, here). ci.yml
    # passes none: a pull request pushes and signs nothing.
    secrets:
      SECUREBOOT_PRIVATE_KEY:
        description: the Secure Boot db key (keys/README.md); a push build without it fails
        required: false
      SIGNING_SECRET:
        description: the cosign private key; a push build without it fails at `sign`
        required: false
    outputs:
      images:
        description: the images built, as JSON (`just images`), for release.yml's promotion
        value: ${{ jobs.plan.outputs.images }}
      keep:
        description: how many build-<sha> images collect keeps (about two builds)
        value: ${{ jobs.plan.outputs.keep }}

# The group is prefixed rather than just ${{ github.workflow }}, because in a
# called workflow that variable holds the CALLER's name: without the prefix a
# release run's build job and the release workflow itself would share a group.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Only push/PR builds supersede each other. A release must not be cancelled
  # halfway by an unrelated push to main.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# bash with -o pipefail on every step (the implicit default shell has no
# pipefail), so a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: fedora-bootc

jobs:
  # The one list of images every job below and release.yml work from (`just
  # images`), and how many build-<sha> images `collect` keeps: two builds'
  # worth, one unsealed and one sealed tag per image per build plus a
  # release's live image (10 for the OS and nvidia). On pull requests too, a
  # few seconds.
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
      keep: ${{ steps.plan.outputs.keep }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      # yq and jq (image/features.sh) come with the runner.
      - name: Images
        id: plan
        run: |
          set -euo pipefail
          images=$(just images)
          keep=$(jq '2 * (2 * length + 1)' <<<"$images")
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "keep=${keep}" >> "$GITHUB_OUTPUT"
          echo "images: ${images}, collect keeps ${keep}"

  # The unsealed OS: packages, overlay, services, bootloader, and its kernel
  # still in place. Built once and then used by every image job, which is
  # the only reason it is a separate job; it is also a usable image on its
  # own, installable the conventional way when the sealed one is
  # inconvenient.
  #
  # Not on pull requests: nothing is pushed there, so the image jobs could
  # not start from it anyway (each job is its own VM) and build the OS
  # themselves. Building it here as well would only cost an hour.
  base:
    name: base
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    environment: release   # the Secure Boot key (the Build step)
    permissions:
      contents: read
      packages: write
      security-events: write   # scan results to code scanning (scan-image)
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          need: "30"
          pull-from: image/base.Containerfile

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      # `just build-base`, as on a workstation. The key is a file outside the
      # checkout, gone when the step ends (also on failure); the build mounts
      # it as a podman secret into the one step that signs, nothing else sees
      # it (the Justfile has the why).
      - name: Build
        env:
          SECUREBOOT_PRIVATE_KEY: ${{ secrets.SECUREBOOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SECUREBOOT_PRIVATE_KEY" || { echo "SECUREBOOT_PRIVATE_KEY secret is not set; see keys/README.md"; exit 1; }
          test -f keys/db/db.pem || { echo "keys/db/db.pem is missing (run: just keygen, commit the public halves)"; exit 1; }
          sb=$(mktemp -d -p "$RUNNER_TEMP")
          trap 'rm -rf "$sb"' EXIT
          (umask 077; printf '%s\n' "$SECUREBOOT_PRIVATE_KEY" > "$sb/db.key")
          SECUREBOOT_KEY="$sb/db.key" just build-base
          df -h /

      # Before the push: an image with a secret or a critical vulnerability in
      # it is never published (.github/actions/scan-image). Also before the
      # login: no registry credential is on the runner while the scan runs.
      - name: Scan
        uses: ./.github/actions/scan-image
        with:
          image: localhost/${{ env.IMAGE_NAME }}:latest
          name: latest

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-<sha>, signed by `sign` below like everything here: the
      # image's own policy refuses an unsigned pull from this repo, and this
      # one is meant to be installable. The image jobs below start from this
      # exact image, handed on by DIGEST: a push build and a release of the
      # same commit can run at once and both push build-<sha>, and each must
      # seal its own base.
      - name: Publish
        id: publish
        uses: ./.github/actions/publish
        with:
          image: localhost/${{ env.IMAGE_NAME }}:latest
          repository: ${{ env.IMAGE_NAME }}

  # One job per image in `plan`'s list, each on its own runner: for an add-on
  # the unsealed add-on image on top of the base above first, then the seal.
  image:
    name: image (${{ matrix.name }})
    needs: [plan, base]
    # Runs after a successful base, or without one on a pull request (base is
    # skipped there, see above); never after a failure or a cancel.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    # The Secure Boot key (the Build step), except on pull requests, which
    # sign with a throwaway one and need no secret: no environment there (an
    # empty name is none, and creates no deployment), so that an environment
    # restricted to main does not turn them away.
    environment:
      name: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    permissions:
      contents: read
      packages: write
      security-events: write   # scan results to code scanning (scan-image)
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      NAME: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's tags: build-<sha>${SUFFIX} unsealed (an add-on's; the
      # OS's own is the base job's) and build-<sha>${SUFFIX}-uki sealed. The
      # same rule as release.yml's promotion.
      - name: Image tag
        run: echo "SUFFIX=$([ "$NAME" = latest ] || echo "-${NAME}")" >> "$GITHUB_ENV"

      # The build needs real room: during a sealed build the image exists
      # several times at once (the add-on image, the split image, chunkah's
      # OCI directory under /var/tmp, its import), about 35 GB on the NVIDIA
      # add-on. A public-repo runner has ~90 GB free on its root disk, where
      # /var/tmp and rootless podman's storage live; the action frees more if
      # a runner comes with less, and fails right here if 50 GB are not there.
      # It pre-pulls what the files this job builds start from: on a pull
      # request the OS's too (there is no base job there), on a push only the
      # add-on's and the seal's, on top of the pushed base.
      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          pull-from: ${{ github.event_name == 'pull_request' && 'image/*.Containerfile' || 'image/addon.Containerfile image/seal.Containerfile' }}

      # The base the job above pushed, by digest. That package may still be
      # private (a new fork), so the pull logs in, into a file of this step
      # alone, gone when it ends: no registry credential is on the runner
      # while the build and the scans run. The login for the push comes
      # after them.
      - name: Pull the base
        if: github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ needs.base.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A path that does not exist yet: podman reads an existing authfile
          # before it logs in, and an empty one is not JSON.
          auth=$(mktemp -d -p "$RUNNER_TEMP")
          trap 'rm -rf "$auth"' EXIT
          authfile="$auth/auth.json"
          printf '%s\n' "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin --authfile "$authfile"
          for attempt in 1 2 3 4 5; do
            if podman pull --quiet --authfile "$authfile" "$BASE_REF" >/dev/null; then echo "pulled $BASE_REF"; break; fi
            [ "$attempt" = 5 ] && { echo "::error::could not pull $BASE_REF after 5 attempts"; exit 1; }
            echo "pull of $BASE_REF failed (attempt $attempt), retrying in 30s" >&2
            sleep 30
          done

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      # For the chunkah check below only; the signing key is not in this job.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # chunkah writes the layers that get sealed and signed. Its pin
      # (image/seal.Containerfile) is checked against the keyless signature
      # its release workflow made before the build runs it; the Justfile
      # recipe has the identity.
      - name: Verify chunkah
        run: just verify-chunkah

      # The same `just build <name>` as on a workstation. The OS comes from
      # the base the job above pushed, by digest (BASE_IMAGE), so the
      # packages are built once per run; on a pull request there is none and
      # the recipe builds it here. For an add-on it builds the unsealed
      # add-on image first (published in its own right below), then seals:
      # :<name>-uki.
      #
      # The db key signs systemd-boot, the sealed UKI and (in the nvidia
      # add-on) the kernel modules. A machine that enrolled the key can only
      # Secure-Boot images signed with it, so pushed builds REQUIRE the
      # secret. Pull requests never get it, not even Renovate's from this
      # repository (ci.yml passes no secrets): they push nothing, so a
      # throwaway key exercises the build end to end just as well, and code
      # nobody has reviewed yet never runs next to the real one.
      #
      # The key is a file outside the checkout, gone when the step ends (also
      # on failure); the builds mount it as a podman secret into the three
      # steps that sign, nothing else sees it (the Justfile has the why).
      - name: Build
        env:
          SECUREBOOT_PRIVATE_KEY: ${{ secrets.SECUREBOOT_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ needs.base.outputs.ref }}
        run: |
          set -euo pipefail
          sb=$(mktemp -d -p "$RUNNER_TEMP")
          trap 'rm -rf "$sb"' EXIT
          if [ "$EVENT" = "pull_request" ]; then
            openssl req -x509 -new -nodes -newkey rsa:4096 -sha256 -days 1 -batch \
              -subj "/CN=throwaway PR build key/" \
              -keyout "$sb/db.key" -out "$sb/db.pem"
            export SECUREBOOT_CERT="$sb/db.pem"
          elif [ -n "$SECUREBOOT_PRIVATE_KEY" ]; then
            test -f keys/db/db.pem || { echo "keys/db/db.pem is missing (run: just keygen, commit the public halves)"; exit 1; }
            (umask 077; printf '%s\n' "$SECUREBOOT_PRIVATE_KEY" > "$sb/db.key")
          else
            echo "SECUREBOOT_PRIVATE_KEY secret is not set; pushed images must be signed with the enrolled db key (keys/README.md)"
            exit 1
          fi
          export SECUREBOOT_KEY="$sb/db.key"
          BASE_IMAGE="$BASE_REF" just build "$NAME"
          df -h /

      # Both scans before anything is pushed and before the login: no
      # registry credential is on the runner while they run. Pull requests
      # too: they push nothing, but what would stop the push fails the PR,
      # except a pending Fedora update, which only warns there
      # (.github/actions/scan-image).
      #
      # The unsealed add-on image is scanned on its own: an add-on adds to
      # the base, the nvidia one including a step that puts the Secure Boot
      # key into the build and removes it again.
      - name: Scan the add-on image
        if: matrix.name != 'latest'
        uses: ./.github/actions/scan-image
        with:
          image: localhost/${{ env.IMAGE_NAME }}:${{ matrix.name }}
          name: ${{ matrix.name }}

      - name: Scan the sealed image
        uses: ./.github/actions/scan-image
        with:
          image: localhost/${{ env.IMAGE_NAME }}:${{ matrix.name }}-uki
          name: ${{ matrix.name }}-uki

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the add-on image
        if: github.event_name != 'pull_request' && matrix.name != 'latest'
        uses: ./.github/actions/publish
        with:
          image: localhost/${{ env.IMAGE_NAME }}:${{ matrix.name }}
          suffix: ${{ env.SUFFIX }}
          repository: ${{ env.IMAGE_NAME }}

      - name: Publish the sealed image
        if: github.event_name != 'pull_request'
        id: publish
        uses: ./.github/actions/publish
        with:
          image: localhost/${{ env.IMAGE_NAME }}:${{ matrix.name }}-uki
          suffix: ${{ env.SUFFIX }}-uki
          repository: ${{ env.IMAGE_NAME }}

      # Which disk filled, and what was on it. The build is the only thing here
      # big enough to run out of space, and this is the only record of it.
      - name: Disk usage on failure
        if: failure()
        run: |
          df -h / || true
          du -sh "$(podman info --format '{{.Store.GraphRoot}}')" 2>/dev/null || true
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.publish.outputs.ref }}
        run: |
          tag="${REF%@*}:build-${GITHUB_SHA:0:7}${SUFFIX}-uki"
          {
            echo "### ${NAME}"
            echo '```'
            echo "${tag}"
            echo "${REF}"
            echo '```'
            echo "Install this build:"
            echo '```'
            echo "sudo bootc switch ${tag}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs everything the jobs above pushed, with the cosign key: the one
  # job that holds it, and it runs nothing but checkout, the artifact
  # download and cosign (.github/actions/sign has the why). The digests come
  # from the publish steps as artifacts, so exactly this run's images are
  # signed. Once, after every image job, whatever they pushed: a failed
  # image job pushed nothing of its own and fails the run, the others'
  # images are still signed and usable.
  sign:
    name: sign
    needs: [plan, base, image]
    if: ${{ !cancelled() && needs.base.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release   # the cosign key
    permissions:
      contents: read    # keys/cosign.pub
      packages: write   # the signatures
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pushed digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pushed*
          merge-multiple: true
          path: ${{ runner.temp }}/pushed

      - name: Sign and verify
        uses: ./.github/actions/sign
        with:
          refs-dir: ${{ runner.temp }}/pushed
          cosign-key: ${{ secrets.SIGNING_SECRET }}
          registry-token: ${{ github.token }}

  # Once, after every image was pushed and signed, with `plan`'s count.
  #
  # A version is only ever considered when it HAS tags and EVERY one of
  # them starts with build-, which makes it impossible to delete something
  # a machine follows even if a promoted digest also carries its build tag.
  #
  # Only after a run that published every image, and best effort on
  # purpose: deleting package versions needs the package to grant this
  # repository the Admin role (package settings, Manage Actions access),
  # and tidying up must never fail a build that otherwise succeeded.
  collect:
    name: collect
    needs: [plan, image, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write   # deleting old package versions
    steps:
      - name: Collect old builds
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ needs.plan.outputs.keep }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          api="/users/${owner}/packages/container/${IMAGE_NAME}/versions"
          gh api --paginate "$api" > "${RUNNER_TEMP}/versions.json"
          jq -r --argjson keep "$KEEP" '
            map(select((.metadata.container.tags | length) > 0
                        and (.metadata.container.tags | all(startswith("build-")))))
            | sort_by(.created_at) | reverse | .[$keep:][]
            | "\(.id) \(.metadata.container.tags | join(","))"
          ' "${RUNNER_TEMP}/versions.json" > "${RUNNER_TEMP}/collect.txt"
          echo "collectable: $(wc -l < "${RUNNER_TEMP}/collect.txt") (keeping the newest ${KEEP})"
          while read -r id tags; do
            [ -n "${id:-}" ] || continue
            echo "deleting ${tags} (${id})"
            gh api -X DELETE "${api}/${id}" >/dev/null || echo "  could not delete ${id}"
          done < "${RUNNER_TEMP}/collect.txt"
