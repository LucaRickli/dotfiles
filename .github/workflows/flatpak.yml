# Build the VS Code Flatpak (devtools/flatpak/) and push it to
# ghcr.io/<owner>/code as an OCI image, :latest and :<yyyymmdd>, for a Flatpak
# remote kept elsewhere to point at. Signed with the cosign key, which `cosign
# verify --key keys/cosign.pub` checks; flatpak itself does not (it checks
# only GPG signatures that a remote's xa.signature-lookaside points at, not
# policy.json or cosign's), so the OS's policy.json has no entry for it.
# Nothing here installs it anywhere; `just flatpak-install` tries a local
# build. No schedule: every new image is a full download for every machine
# that follows it (about 950 MB, no deltas), so it is only rebuilt when
# something in it changes, which Renovate's weekly PR usually does. Pull
# requests get it through ci.yml, the PR gate, and only build and test; the
# Justfile recipe, devtools/test.sh and the secret scan rules
# (.github/actions/scan-image) are tested there too, but a push of only
# those pushes nothing.
name: flatpak

on:
  push:
    branches: [main]
    paths:
      - "devtools/flatpak/**"
      - "devtools/claude-code.sh"
      - "devtools/claude-code.asc"
      - "devtools/mise-system.sh"
      - "devtools/mise-config.toml"
      - "devtools/tools.txt"
      - "devtools/extensions.txt"
      - "devtools/install.sh"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:
  workflow_call:

# Only pull requests supersede each other. Any other run waits for the one
# before it, which, cancelled between its push and `sign`, would leave the
# tags on an unsigned image.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Everything that downloads or runs third-party code (the tools, the
  # runtime, VS Code in the test) happens here, before the registry login.
  # The token can write packages (the push) but not the repository.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          need: "25"
          pull: quay.io/fedora/fedora:latest

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      # Builds, installs the result the way a machine does (VS Code comes from
      # Microsoft right there) and runs devtools/test.sh inside it.
      - name: Build and test
        run: just flatpak

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # skopeo copies the manifest byte for byte, so the digest in the summary
      # is the one a remote's index names.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/code"
          skopeo copy --retry-times 3 --digestfile "${RUNNER_TEMP}/digest" \
            oci:output/flatpak/oci "docker://${image}:latest"
          skopeo copy --retry-times 3 oci:output/flatpak/oci "docker://${image}:$(date -u +%Y%m%d)"
          echo "Pushed \`${image}@$(cat "${RUNNER_TEMP}/digest")\`" >> "$GITHUB_STEP_SUMMARY"
          # For `sign`: one digest, as both copies are the same manifest.
          mkdir -p "${RUNNER_TEMP}/pushed"
          echo "${image}@$(cat "${RUNNER_TEMP}/digest")" > "${RUNNER_TEMP}/pushed/code"

      - name: Record the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pushed-code
          path: ${{ runner.temp }}/pushed/code
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # The cosign key in a job of its own that runs nothing but checkout, the
  # artifact download and cosign, as build.yml's `sign` (.github/actions/sign
  # has the why).
  sign:
    name: sign
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release   # the cosign key
    permissions:
      contents: read    # keys/cosign.pub
      packages: write   # the signature
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pushed digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pushed-code
          path: ${{ runner.temp }}/pushed

      - name: Sign and verify
        uses: ./.github/actions/sign
        with:
          refs-dir: ${{ runner.temp }}/pushed
          cosign-key: ${{ secrets.SIGNING_SECRET }}
          registry-token: ${{ github.token }}
