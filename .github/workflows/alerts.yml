# Every open code scanning alert nobody is assigned to is assigned to you
# (.github/actions/scan-image/assign-alerts.sh). An assignment is what
# GitHub emails; nothing else about an alert is, and no workflow trigger
# exists for a new one. So: after every workflow that uploads scan results
# on main, and daily, for what CodeQL's default setup uploads on its own
# schedule and for a release you publish by hand (its run is on the tag,
# which `branches: [main]` leaves out).
#
# workflow_run runs in this repository's own context: nothing of the
# triggering run is checked out or executed, only this repository's script
# at HEAD of main (which is why zizmor's warning about the trigger is
# ignored below).
name: alerts

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    # By `name:`: the workflows that upload scan results.
    workflows: [build, release, devcontainer]
    types: [completed]
    branches: [main]
  schedule:
    # An odd minute: GitHub delays or drops schedules on the hour.
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be assigned, assign nothing"
        type: boolean
        default: false

# Nothing by default; the job asks for what it needs.
permissions: {}

# One at a time, so two quick uploads cannot assign the same alert twice.
concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  assign:
    # `branches: [main]` matches the head branch NAME, which a fork's pull
    # request can share, so the event and the repository are checked too.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read           # the checkout
      security-events: write   # assigning the alerts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Whoever owns the repository. An organisation cannot be assigned:
      # name a member here then.
      - name: Assign the new alerts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=()
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          .github/actions/scan-image/assign-alerts.sh "${args[@]}" "$ASSIGNEE"
