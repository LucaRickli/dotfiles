# The dotfiles' syntax checks (check.sh) on every push to main and every pull
# request. jq comes with the runner; fish is installed here.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: sudo apt-get update -q && sudo apt-get install -y -q fish

      - name: Check
        run: ./check.sh
