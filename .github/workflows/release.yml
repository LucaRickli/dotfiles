# Cut a release: build the images and the live install ISO, publish the ISO as
# a GitHub release, then point the tags machines follow at this build.
#
# Versions are <year>.<week>, the ISO week (UTC) the release was cut in, so
# 26.36 is the 36th week of 2026. A second release in the same week adds a
# patch level: 26.36.1, 26.36.2. Both come from `date +%g.%V`, which is the ISO
# year paired with the ISO week; %y or %Y would be wrong here, because the last
# days of December belong to week 1 of the following ISO year.
#
# Three ways in:
#   schedule           every Monday at 10:00 UTC, version 26.36
#   workflow_dispatch  now, with a version you name or the next free one
#   release published  a release you created by hand gets its images and ISO
#
# The release is created with GITHUB_TOKEN, and a release created that way does
# not fire the `release: published` event, so the scheduled run cannot trigger
# itself.
#
# Renovate's weekly PR (renovate.json) is scheduled for the weekend, so what it
# merged is in the Monday release. If a scheduled or manually dispatched
# release fails, notify.yml opens an issue assigned to the repository owner; a
# run for a release published by hand is reported by GitHub to whoever
# published it.
name: release

on:
  schedule:
    # Plain UTC on purpose: a local time would need two cron entries and a
    # guard to survive daylight saving. Monday, because ISO weeks start then.
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (default: this week's, or its next patch level)"
        required: false
        type: string
  release:
    types: [published]

# Nothing by default; each job asks for what it needs.
permissions: {}

# Never cancel a release halfway: it pushes images and creates a tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bash with -o pipefail on every step.
defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: fedora-bootc
  # Below GitHub's 2 GiB per-asset cap, with room for the part suffix.
  SPLIT_BYTES: 1900M

jobs:
  # Which version, and whether to release at all.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Each path writes the `release` output exactly once: a duplicated
          # key in $GITHUB_OUTPUT is not worth relying on.
          skip() { echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # A scheduled run delayed by GitHub still releases; the "already
          # released this week" check below keeps it to one per week.
          week=$(date -u +%g.%V)
          if [ "$EVENT" = release ]; then
            version="$TAG"                      # a release someone published by hand
          elif [ -n "$WANT" ]; then
            version="$WANT"
          else
            version="$week"
            # actions/checkout fetches no tags, so ask the remote.
            if git ls-remote --tags --exit-code origin "refs/tags/$week" >/dev/null 2>&1; then
              if [ "$EVENT" = schedule ]; then
                echo "::notice::$week is already released, nothing to do"
                skip
              fi
              # Manual re-release in the same week: next free patch level.
              n=1
              while git ls-remote --tags --exit-code origin "refs/tags/$week.$n" >/dev/null 2>&1; do
                n=$((n + 1))
              done
              version="$week.$n"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $version"

  # The OS images. Exactly the same workflow that runs on every push, and it
  # publishes the same build-<sha>* tags. Nothing machines follow moves here;
  # that happens in "Promote this build" at the very end, once the ISO exists
  # and the release is published.
  # A failed NVIDIA build fails the release, on purpose: promoting one variant
  # and not the other would leave the two out of step.
  images:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  iso:
    needs: [plan, images]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write   # the release and its tag
      packages: write   # the live image, and moving the promoted tags
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Much less than a sealed build needs: the live image, the Fedora
      # container that assembles the ISO, the squashfs and the ISO itself.
      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          need: "35"
          pull-from: Containerfile
          # what `just iso` assembles the ISO in
          pull: quay.io/fedora/fedora:latest

      # The ISO is assembled by live/build-iso.sh inside a Fedora container,
      # so the runner needs nothing but podman and just (not preinstalled).
      # just itself is pinned too (Renovate bumps it through the PR gate),
      # instead of whatever release is newest when the release runs.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      # No Secure Boot key here on purpose. The live image signs nothing:
      # `--target live` never builds the stages that would need one, and the
      # ISO deliberately ships no shim, so it does not boot under Secure Boot
      # at all (live/prepare-live.sh has the why).
      # `just iso` builds the live image (localhost/fedora-bootc:live) and
      # assembles the ISO from it. The steps below scan, push and sign that
      # same image: building it a second time could pick up a newer base and
      # give the ISO a rootfs nobody scanned.
      - name: Build the live image and the ISO
        id: iso
        run: |
          set -euo pipefail
          just iso
          iso=$(find output -maxdepth 1 -name '*.iso' | head -1)
          test -n "$iso" || { echo "just iso produced no ISO in output/" >&2; exit 1; }
          mv "$iso" "${GITHUB_WORKSPACE}/fedora-bootc-live.iso"
          echo "iso-dest=${GITHUB_WORKSPACE}/fedora-bootc-live.iso" >> "$GITHUB_OUTPUT"
          df -h /

      # Before the push, like every image, and before the login, so trivy
      # never runs next to the token (.github/actions/scan-image). The
      # installer Flatpak (pinned in live/) and its runtime (from Flathub at
      # build time) are upstream builds.
      - name: Scan the live image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:live
          upstream-paths: var/lib/flatpak/

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the live image
        id: push
        run: |
          set -euo pipefail
          # Same rule as every other image here: one immutable tag, nothing
          # overwritten. `live` is a moving tag and is written by the promote
          # step at the end, not by the thing that built it.
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          ref="${registry}/${IMAGE_NAME}:build-${GITHUB_SHA:0:7}-live"
          podman push --retry 5 --retry-delay 15s --digestfile="${RUNNER_TEMP}/digestfile" "${IMAGE_NAME}:live" "$ref"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat "${RUNNER_TEMP}/digestfile")" >> "$GITHUB_OUTPUT"

      # Everything this repo publishes is signed, the live image included, so a
      # machine with our policy.json can pull it like any other tag. Signing
      # the digest is also what makes promotion free: `live` ends up pointing
      # at an already-signed digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same pin as build.yml, where the reason is.
          cosign-release: "v3.1.3"

      - name: Sign the live image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REF: ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || {
            echo "SIGNING_SECRET is not set; see keys/README.md"; exit 1; }
          # Retried like build.yml's signing; signing twice is harmless.
          for attempt in 1 2 3; do
            cosign sign -y --new-bundle-format=false --use-signing-config=false \
              --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$REF" && break
            [ "$attempt" = 3 ] && exit 1
            echo "cosign sign attempt $attempt failed, retrying in 15s" >&2; sleep 15
          done
          cosign verify --key keys/cosign.pub --insecure-ignore-tlog=true "$REF"

      - name: Checksum and split if needed
        id: assets
        env:
          ISO: ${{ steps.iso.outputs.iso-dest }}
        run: |
          set -euo pipefail
          iso="$ISO"
          sha256sum "$iso" | sed "s| .*| fedora-bootc-live.iso|" > SHA256SUMS
          size=$(stat -c %s "$iso")
          limit=$((2 * 1024 * 1024 * 1024))
          echo "ISO is $((size / 1024 / 1024)) MiB"
          if [ "$size" -lt "$limit" ]; then
            echo "assets=$iso SHA256SUMS" >> "$GITHUB_OUTPUT"
          else
            # Too big for one asset. Split, and say so in a file next to the
            # parts, because a bare .part-aa is not self-explanatory.
            echo "over the ${limit} byte asset limit, splitting"
            split -b "${SPLIT_BYTES}" -d "$iso" fedora-bootc-live.iso.part
            cat > REASSEMBLE.txt << 'EOF'
          The ISO exceeds GitHub's 2 GiB per-asset limit, so it is split.

              cat fedora-bootc-live.iso.part* > fedora-bootc-live.iso
              sha256sum -c SHA256SUMS

          Then write it to a USB stick as usual. The checksum covers the
          reassembled ISO, not the individual parts.
          EOF
            echo "assets=$(echo fedora-bootc-live.iso.part* | tr '\n' ' ') SHA256SUMS REASSEMBLE.txt" >> "$GITHUB_OUTPUT"
          fi

      # Created only now, with the assets in hand, so a release never exists in
      # a half-published state. `gh release create` makes the tag too, on the
      # commit this run was built from.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          ASSETS: ${{ steps.assets.outputs.assets }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          cat > NOTES.md << EOF
          Weekly build of the Fedora bootc image.

          ### Images

          Signed with cosign; the image verifies its own updates against the key
          it ships (\`/etc/pki/containers/fedora-bootc.pub\`).

              ${registry}/${IMAGE_NAME}:latest        the OS, unsealed
              ${registry}/${IMAGE_NAME}:latest-uki    sealed into a signed UKI
              ${registry}/${IMAGE_NAME}:nvidia        unsealed, NVIDIA driver
              ${registry}/${IMAGE_NAME}:nvidia-uki    that one sealed
              ${registry}/${IMAGE_NAME}:live          the install ISO's live system

          Those five are the only tags that move, and this release is what
          they now point at. The install ISO deploys \`latest-uki\`. Until ten
          newer builds replace it, this build also has a tag of its own, for
          testing exactly this one:

              sudo bootc switch ${registry}/${IMAGE_NAME}:build-${GITHUB_SHA:0:7}-uki

          ### Install media

          \`fedora-bootc-live.iso\`, checksum in \`SHA256SUMS\`. It carries no
          shim and is not signed for Secure Boot, so **turn Secure Boot off to
          boot it**; turn it back on after enrolling your own keys.
          EOF
          # shellcheck disable=SC2086  # the asset list is deliberately split
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" $ASSETS --clobber
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file NOTES.md \
              --target "$GITHUB_SHA" \
              $ASSETS
          fi

      # LAST. Everything above has to have worked: both variants built, pushed
      # and signed, the ISO assembled, the release published. Only then do the
      # tags machines follow move, and moving them is just a new tag on a
      # digest that already exists, so there is no rebuild and the signature
      # made during the build still covers it.
      #
      # These five are the only tags in this repo that ever move, and they
      # keep the same shape as the build tags they come from: the unsealed OS
      # is `latest`, sealed is `-uki`. Everything else is build-<sha>, which
      # never moves but is deleted once ten newer build-only images exist
      # (build.yml).
      - name: Promote this build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          sha="${GITHUB_SHA:0:7}"
          # skopeo is the only registry-to-registry copy here (podman cannot
          # do it); the runner has it. A docker:// to docker:// copy needs no
          # user namespace, so Ubuntu's AppArmor rules do not get in the way.
          # Auth goes through an authfile so the token never appears on a
          # command line; skopeo copy --authfile uses it for both endpoints,
          # which are the same registry.
          authfile="${RUNNER_TEMP}/ghcr-auth.json"
          trap 'rm -f "$authfile"' EXIT   # never leave the token behind, even on a failed copy
          printf '%s\n' "$GITHUB_TOKEN" \
            | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin --authfile "$authfile"
          repo="${registry}/${IMAGE_NAME}"
          for pair in "build-${sha}=latest" \
                      "build-${sha}-uki=latest-uki" \
                      "build-${sha}-nvidia=nvidia" \
                      "build-${sha}-nvidia-uki=nvidia-uki" \
                      "build-${sha}-live=live"; do
            src="${pair%%=*}"; dst="${pair##*=}"
            # By digest, and only a verified one: a push build of the same
            # commit may be running alongside this release and pushing the
            # same build-<sha> tags, so the tag is resolved once, its
            # signature checked the way a machine checks it, and exactly
            # that digest promoted.
            digest=$(skopeo inspect --retry-times 3 --authfile "$authfile" --format '{{.Digest}}' "docker://${repo}:${src}")
            cosign verify --key keys/cosign.pub --insecure-ignore-tlog=true "${repo}@${digest}" >/dev/null
            echo "promoting ${src} (${digest}) -> ${dst}"
            # --preserve-digests: fail rather than rewrite the manifest, since
            # the signature is on the digest and a new one would be unsigned.
            skopeo copy --all --preserve-digests --retry-times 3 --authfile "$authfile" \
              "docker://${repo}@${digest}" "docker://${repo}:${dst}"
          done
          {
            echo "### Promoted"
            echo '```'
            for t in latest latest-uki nvidia nvidia-uki live; do
              echo "${registry}/${IMAGE_NAME}:${t}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk usage on failure
        if: failure()
        run: |
          df -h / || true
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true
