# trivy's secret scanner, on top of its built-in rules (scan.sh).

# Its built-in allow rules skip /usr/lib, /usr/share and /usr/include. On an
# image-based system /usr is exactly what every machine shares, so a key a
# build step leaves there is the case to catch. (Measured on these images:
# no finding appears that this would have hidden.)
disable-allow-rules:
  - usr-dirs

rules:
  # xrdp's key for RDP's own security layer is an ini file, not PEM, so the
  # built-in private-key rule misses it. The private exponent is the secret.
  - id: xrdp-rsakeys
    category: XRDP
    title: XRDP RSA private key (rsakeys.ini)
    severity: HIGH
    keywords:
      - pri_exp=
    regex: (?m)^pri_exp=0x[0-9a-fA-F]{2}

allow-rules:
  # The live image's installer Flatpak bundles a Go toolchain, and Go's
  # standard library sources carry public test keys
  # (crypto/x509/platform_root_key.pem, crypto/tls/testdata/example-key.pem).
  - id: installer-go-sources
    description: Go standard library sources in the bootc-installer Flatpak
    path: ^/?var/lib/flatpak/app/org\.bootcinstaller\.Installer/.*/files/go/src/
  # Flatpak's object store holds a second copy (a hardlink) of every file the
  # installed apps and runtimes have. Those are scanned under their real paths
  # above; here they would only repeat, without saying which app they are.
  - id: flatpak-objects
    description: Flatpak's object store, a copy of the deployed apps and runtimes
    path: ^/?var/lib/flatpak/repo/objects/
