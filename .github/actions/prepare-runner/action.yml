# Make a GitHub-hosted ubuntu-26.04 runner fit for the rootless podman builds
# here. Every job that builds, pulls or runs an image uses it, right after
# actions/checkout (a local action only exists once the repo is checked out).
#
# What differs from a workstation:
#
# - /tmp is a RAM-backed tmpfs on 26.04 (half the RAM, ~7.8 GB, and a user
#   quota that fails writes at ~6.3 GB; actions/runner-images#14777). Masked
#   and unmounted, which is the maintainers' own workaround, so /tmp is the
#   root disk again.
# - Ubuntu confines user namespaces with AppArmor. podman and buildah have
#   profiles that allow them, but a sandbox inside a build (the Flatpak
#   install in installer/live.Containerfile runs bwrap) does not: the
#   bwrap-userns-restrict profile strips the capabilities of whatever bwrap
#   starts. The runner is a throwaway VM, so the restriction is lifted and
#   bwrap's children stay in its own profile (the override bootc-dev/actions
#   ships for 26.04, #55).
# - Disk. The image exists three times at once during a sealed build (see
#   build.yml, ~37 GB on the NVIDIA variant). Public-repo runners come with a
#   ~145 GB root disk and ~90 GB free, but GitHub only promises 14 GB, so the
#   preinstalled toolchains nobody here uses are removed when there is less
#   than `cleanup-below` GB free, and the job stops right here, with a clear
#   message, if there is still less than `need` GB. Rootless podman keeps its
#   storage in ~/.local/share/containers, on that same root disk.
# - Registries. Pulls fail transiently often enough to matter, and podman's
#   own --retry does not catch every such failure. The images named in `pull`
#   and in the FROM lines of `pull-from` are pulled here in a retry loop, so
#   that the build's --pull=newer finds them locally (it suppresses pull
#   errors when a local copy exists).
name: Prepare the runner
description: tmpfs /tmp off, user namespaces usable, enough free disk, base images pulled
inputs:
  need:
    description: GB that must be free on / (fails the job otherwise)
    default: "50"
  cleanup-below:
    description: remove unused preinstalled toolchains if fewer GB than this are free
    default: "70"
  pull-from:
    description: Containerfiles whose registry FROM images to pre-pull (whitespace-separated, globs allowed)
    default: ""
  pull:
    description: further image references to pre-pull (whitespace-separated)
    default: ""
runs:
  using: composite
  steps:
    - name: tmpfs /tmp, AppArmor, disk
      shell: bash
      env:
        NEED: ${{ inputs.need }}
        CLEANUP_BELOW: ${{ inputs.cleanup-below }}
      run: |
        set -euo pipefail
        if findmnt -n -t tmpfs /tmp >/dev/null; then
          sudo systemctl mask tmp.mount
          sudo umount -l /tmp
        fi

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
           sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
          printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' |
            sudo tee /etc/apparmor.d/local/bwrap-userns-restrict >/dev/null
          sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        fi

        free_gb() { df --output=avail -BG / | tail -1 | tr -dc '0-9'; }
        before=$(free_gb)
        if [ "$before" -lt "$CLEANUP_BELOW" ]; then
          echo "::notice::${before} GB free, below ${CLEANUP_BELOW} GB: removing unused toolchains"
          # None of this is used by any workflow here. The runner is
          # discarded after the job, so nothing needs to be put back.
          sudo swapoff -a 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/microsoft \
            /usr/local/julia* /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium \
            /swapfile /mnt/swapfile
          # The tool cache is emptied, not removed: a setup-* action later
          # in a job installs into it and cannot recreate it.
          sudo find "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          echo "freed $(( $(free_gb) - before )) GB"
        fi
        df -h / /tmp
        if [ "$(free_gb)" -lt "$NEED" ]; then
          echo "::error::only $(free_gb) GB free on /, this job needs ${NEED} GB"
          exit 1
        fi

        podman version --format 'podman {{.Client.Version}}'
        podman info --format 'graphroot: {{.Store.GraphRoot}} ({{.Store.GraphDriverName}})'

    - name: Pre-pull the base images
      if: inputs.pull-from != '' || inputs.pull != ''
      shell: bash
      env:
        PULL_FROM: ${{ inputs.pull-from }}
        PULL: ${{ inputs.pull }}
      run: |
        set -euo pipefail
        images=()
        # FROM lines naming a registry image (a dot in the first path part):
        # not scratch, not a stage, not ${BASE_IMAGE}.
        for f in $PULL_FROM; do
          while read -r ref; do images+=("$ref"); done < <(
            awk 'toupper($1) == "FROM" { i = 2; while ($i ~ /^--/) i++; print $i }' "$f" |
              grep -E '^[a-z0-9-]+(\.[a-z0-9-]+)+(:[0-9]+)?/' || true)
        done
        for ref in $PULL; do images+=("$ref"); done
        [ "${#images[@]}" -gt 0 ] || { echo "nothing to pull"; exit 0; }
        for ref in $(printf '%s\n' "${images[@]}" | sort -u); do
          for attempt in 1 2 3 4 5; do
            if podman pull --quiet "$ref" >/dev/null; then echo "pulled $ref"; break; fi
            [ "$attempt" = 5 ] && { echo "::error::could not pull $ref after 5 attempts"; exit 1; }
            echo "pull of $ref failed (attempt $attempt), retrying in 30s" >&2
            sleep 30
          done
        done
