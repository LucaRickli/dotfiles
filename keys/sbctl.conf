# sbctl configuration for `just keygen`, which runs sbctl inside the key
# directory (the Justfile's keys_dir, outside the checkout). sbctl resolves
# these paths against its working directory, so the key tree and the GUID
# land there; keygen copies the certificates and the GUID into keys/.
# Enrolling a machine runs `sbctl enroll-keys --config <this file>` from
# inside that directory as well (docs/secureboot-tpm2.md).
keydir: "."
guid: "GUID"
