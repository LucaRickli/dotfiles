# The NVIDIA driver from RPM Fusion nonfree (its repos from pre-install.sh).
# An add-on: not part of the base image, built on top of it for the NVIDIA
# images (image/addon.Containerfile, `just build nvidia` or `just
# build-nvidia`; tags nvidia and nvidia-uki).
addon: true
packages:
  # Kernel module, built at image build time against the image's kernel
  # (akmods, post-install.sh). Open kernel modules by default (Turing/RTX 2000
  # and newer); `just build nvidia closed` (ADDON_FLAVOR=closed) for older
  # GPUs. Signed for Secure Boot with the db key (podman secrets; see
  # keys/README.md).
  - akmod-nvidia

  # Userspace driver + libraries (xorg-x11-drv-nvidia-libs pulls in
  # egl-wayland etc.)
  - xorg-x11-drv-nvidia
  - xorg-x11-drv-nvidia-libs
  - xorg-x11-drv-nvidia-cuda
  - xorg-x11-drv-nvidia-power
  - nvidia-settings

  # Hardware video acceleration (VA-API). Fedora packages, not RPM Fusion.
  - libva-nvidia-driver
  - libva-utils
requires:
  - kernel-build  # what the module build calls (kbuild, akmods)
