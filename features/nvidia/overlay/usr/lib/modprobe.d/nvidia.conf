# =============================================================================
# NVIDIA kernel module options
# =============================================================================
#
# nvidia_drm.modeset=1
#   Enables DRM kernel mode-setting. REQUIRED for Wayland compositors to use
#   the NVIDIA GPU directly (via GBM/EGL).
#
# nvidia_drm.fbdev=1
#   Exposes a /dev/fb device backed by the NVIDIA DRM driver (kernel >= 6.2),
#   so the text console keeps working on the NVIDIA output.
#
# nvidia.NVreg_PreserveVideoMemoryAllocations=1
#   Keeps GPU memory allocations across suspend/resume cycles (RPM Fusion's
#   kmod already defaults to this; kept explicit). Needs the nvidia-suspend/
#   nvidia-resume/nvidia-hibernate services, enabled by xorg-x11-drv-nvidia-power.
# =============================================================================

options nvidia_drm modeset=1 fbdev=1
options nvidia    NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
