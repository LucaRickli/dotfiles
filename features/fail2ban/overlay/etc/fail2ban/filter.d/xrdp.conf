# Failed RDP logins.
#
# xrdp has no fail2ban filter upstream, so this one is ours. The pattern is not
# guessed: /usr/libexec/xrdp/xrdp-sesexec contains the format string
#   AUTHFAIL: user=%s ip=%s time=%d
# which is what it writes when PAM rejects a login. sesman has EnableSyslog=true
# so it lands in the journal.
#
# No journalmatch on purpose. The message comes from xrdp-sesexec, which sesman
# spawns, and pinning the unit or _COMM risks a filter that matches nothing at
# all, which is the failure mode that would leave RDP unprotected while looking
# configured. The string is distinctive enough to scan for on its own.

[Definition]

failregex = ^\s*AUTHFAIL: user=\S* ip=<HOST> time=\d+\s*$

ignoreregex =
