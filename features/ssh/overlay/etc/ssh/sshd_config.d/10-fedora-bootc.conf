# SSH policy for this image.
#
# Numbered 10 on purpose: /etc/ssh/sshd_config includes this directory near the
# top and sshd keeps the FIRST value it sees for a keyword, so a drop-in only
# overrides Fedora's 50-redhat.conf if it sorts before it.

# Log in as yourself, not as root. Passwords are never accepted for root, so a
# machine cannot become root-reachable by someone setting one. A key still
# works, and this image bakes in no root key.
#
# Plain `no` would be stricter but locks out bcvk, which drives its throwaway
# install VM over root SSH with a key injected as a systemd credential; that
# is how `just qcow2` builds a test disk. The cost: a key placed by whoever
# controls the boot environment (a hypervisor, a writable ESP) reaches root.
PermitRootLogin prohibit-password

# Passwords are accepted. That is a deliberate trade: it makes a machine
# reachable without provisioning a key first, at the cost of exposing every
# account's password to anything that can reach port 22. Use strong passwords,
# and prefer keys where you can. PermitEmptyPasswords stays off regardless,
# which matters because a freshly created account can have no password at all.
PasswordAuthentication yes
PermitEmptyPasswords no

# Fedora's 50-redhat.conf already sets this; repeated here so that the auth
# surface this file opens is visible in one place.
KbdInteractiveAuthentication no

# Three tries per connection rather than six, since passwords are enabled.
MaxAuthTries 3

# Legal notice, sent before authentication. The file is image content, so
# editing it means editing the image; point this at a path under /etc if a
# machine needs its own wording.
Banner /usr/share/fedora-bootc/ssh-banner
