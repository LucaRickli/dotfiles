# Keyboard layout for X11 (what `localectl set-x11-keymap ch` writes). localed
# also serves it to niri, whose /etc/niri/config.kdl leaves xkb empty, and
# noctalia-greeter reads this file itself (a [keyboard] layout in
# /var/lib/noctalia-greeter/greeter.toml would win). Elsewhere: labwc
# /etc/xdg/labwc/environment, the console /etc/vconsole.conf.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "ch"
EndSection
