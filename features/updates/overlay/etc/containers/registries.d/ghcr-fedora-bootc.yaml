# Tell containers/image to look for the cosign signature as a sigstore
# attachment on the registry (the `.sig` tag cosign pushes next to the image),
# which is what /etc/containers/policy.json requires for these repositories:
# the OS and the dev container. Without this the sigstoreSigned rule would
# find no signature and every pull from them would fail. The VS Code Flatpak
# (ghcr.io/lucarickli/code) is signed too, but flatpak reads neither file.
docker:
  ghcr.io/lucarickli/fedora-bootc:
    use-sigstore-attachments: true
  ghcr.io/lucarickli/devcontainer:
    use-sigstore-attachments: true
